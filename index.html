dl:[{r:'لَتُفْتَحَنَّ الْقُسْطَنْطِينِيَّةُ فَلَنِعْمَ الْأَمِيرُ أَمِيرُهَا وَلَنِعْمَ الْجَيْشُ ذَلِكَ الْجَيْشُ',i:'Konstantinopel pasti akan ditaklukkan. Sebaik-baik pemimpin adalah pemimpinnya dan sebaik-baik pasukan adalah pasukan itu. (H.R. Ahmad)'}],
ct:'Mengenalkan Islam lewat karya seni dan akhlak baik di lingkungan sendiri.',rg:'Sejarah Usmani dan Wali Songo mengajarkan kerja keras, strategi, dan dakwah damai.',
Q:{m:[{q:'Konstantinopel ditaklukkan Sultan Muhammad Al-Fatih pada tahun...',o:['1258 M','1492 M','1453 M','1299 M']},{q:'Sunan Kalijaga berdakwah lewat wayang dan tembang. Pendekatan ini menunjukkan dakwah yang...',o:['Memaksa masyarakat meninggalkan budaya','Menyesuaikan budaya setempat secara damai','Menghindari seni','Hanya lewat perang']}],u:['Bandingkan strategi dakwah Wali Songo dengan semangat Al-Fatih. Teladan apa yang bisa kamu ambil?']}},
{e:'🌍',t:'Manusia sebagai Khalifah, Menjaga Lingkungan, dan Menyebarkan Kasih Sayang',tj:['Menjelaskan peran manusia sebagai khalifah','Menunjukkan sikap menjaga lingkungan','Menyebarkan kasih sayang kepada sesama makhluk'],pk:['Khalifah','Menjaga lingkungan','Rahmah','Kasih sayang kepada semua makhluk'],
ms:['Manusia diciptakan sebagai khalifah, yaitu pengelola dan penjaga bumi (Q.S. Al-Baqarah: 30). Amanah ini berarti memakmurkan, bukan merusak.','Menjaga lingkungan: tidak membuang sampah sembarangan, menghemat air dan listrik, menanam pohon, dan tidak merusak alam.','Kasih sayang (rahmah) ditujukan kepada manusia, hewan, dan tumbuhan. Rasulullah saw. diutus sebagai rahmat bagi semesta alam.','Menyebarkan kasih sayang: menolong yang lemah, menyapa ramah, memaafkan, dan tidak menyakiti makhluk lain.'],
dl:[{r:'وَإِذْ قَالَ رَبُّكَ لِلْمَلَائِكَةِ إِنِّي جَاعِلٌ فِي الْأَرْضِ خَلِيفَةً',i:'Ingatlah ketika Tuhanmu berfirman kepada para malaikat, “Aku hendak menjadikan khalifah di bumi.” (Q.S. Al-Baqarah: 30)'},{r:'ارْحَمُوا مَنْ فِي الْأَرْضِ يَرْحَمْكُمْ مَنْ فِي السَّمَاءِ',i:'Sayangilah yang ada di bumi, niscaya yang di langit akan menyayangimu. (H.R. Tirmidzi)'}],
ct:'Memilah sampah, merawat tanaman sekolah, dan membantu teman yang kesulitan.',rg:'Manusia adalah khalifah yang wajib menjaga bumi dan menebar kasih sayang kepada semua makhluk.',
Q:{m:[{q:'Sebuah pabrik membuang limbah ke sungai hingga ikan mati. Menurut peran manusia sebagai khalifah, tindakan ini...',o:['Boleh asal menguntungkan','Bertentangan dengan tugas menjaga dan memakmurkan bumi','Urusan pemerintah saja','Tidak berdampak apa pun']},{q:'Hadis “sayangilah yang ada di bumi” dapat diterapkan dengan...',o:['Merawat hewan dan membantu sesama','Hanya menyayangi keluarga','Menyayangi manusia, hewan boleh disakiti','Menunggu perintah guru']}],u:['Jelaskan dua tindakan nyata menjaga lingkungan di sekolah sebagai wujud peran khalifah, beserta dalilnya.']}},
{e:'🤲',t:'Qada dan Qadar',tj:['Menjelaskan pengertian qada dan qadar','Menghubungkan ikhtiar, doa, dan tawakal','Menunjukkan hikmah beriman kepada takdir'],pk:['Qada dan qadar','Ikhtiar','Doa','Tawakal','Hikmah'],
ms:['Qada: ketetapan Allah sejak azali. Qadar: perwujudan ketetapan itu sesuai ukuran dan waktunya. Iman kepada qada dan qadar adalah rukun iman keenam.','Manusia wajib berikhtiar. Allah tidak mengubah keadaan suatu kaum sampai mereka mengubah diri sendiri (Q.S. Ar-Ra’d: 11).','Doa adalah memohon kepada Allah. Tawakal adalah berserah diri setelah berikhtiar dan berdoa, bukan pasrah tanpa usaha.','Hikmah: sabar saat musibah, syukur saat nikmat, tidak sombong, tidak putus asa, dan hidup lebih tenang.'],
dl:[{r:'إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ',i:'Sesungguhnya Kami menciptakan segala sesuatu menurut ukuran. (Q.S. Al-Qamar: 49)'},{r:'فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ',i:'Apabila engkau telah membulatkan tekad, bertawakallah kepada Allah. (Q.S. Ali Imran: 159)'}],
ct:'Belajar sungguh-sungguh dan berdoa sebelum ujian, lalu menerima hasilnya dengan lapang dada.',rg:'Ikhtiar, doa, dan tawakal berjalan bersama. Takdir mengajarkan sabar, syukur, dan optimisme.',
Q:{m:[{q:'Sinta belajar giat, berdoa, lalu menyerahkan hasilnya kepada Allah. Sikap ini disebut...',o:['Pasrah tanpa usaha','Ikhtiar, doa, lalu tawakal','Menyalahkan takdir','Menunggu keberuntungan']},{q:'Budi gagal masuk tim futsal. Sikap yang mencerminkan iman kepada qada dan qadar adalah...',o:['Marah dan menyalahkan Allah','Berhenti berlatih selamanya','Bersabar, mengevaluasi diri, dan mencoba lagi','Menyalahkan pelatih']}],u:['Jelaskan hubungan ikhtiar, doa, dan tawakal dengan contoh dalam menghadapi ujian.']}},
{e:'🎨',t:'Seni dalam Islam',tj:['Menjelaskan pengertian seni Islami','Menyebutkan jenis-jenis seni dalam Islam','Menghayati nilai keindahan dan keharmonisan'],pk:['Seni Islami','Seni rupa','Seni suara','Seni sastra','Keindahan dan harmoni'],
ms:['Seni Islami adalah karya yang mengungkapkan keindahan sesuai nilai tauhid dan akhlak, tanpa melanggar syariat.','Jenisnya: seni rupa (kaligrafi, ornamen, arsitektur masjid), seni suara (tilawah, azan, selawat, nasyid), seni sastra (syair dan puisi), serta seni gerak dan drama yang sopan dan bermakna baik.','Nilai keindahan: Allah Maha Indah dan mencintai keindahan. Keharmonisan: keseimbangan bentuk, warna, dan pesan yang menenangkan.','Batas: tidak mengandung syirik, maksiat, atau pornografi, dan tidak menimbulkan kerusakan.'],
dl:[{r:'إِنَّ اللَّهَ جَمِيلٌ يُحِبُّ الْجَمَالَ',i:'Sesungguhnya Allah itu indah dan menyukai keindahan. (H.R. Muslim)'}],
ct:'Menghias mading sekolah dengan kaligrafi dan mengikuti lomba tilawah atau selawat.',rg:'Seni Islami menyampaikan keindahan dan keharmonisan dengan tetap berpegang pada syariat.',
Q:{m:[{q:'Kaligrafi pada dinding masjid termasuk jenis seni...',o:['Seni suara','Seni rupa','Seni tari','Seni drama']},{q:'Sebuah nasyid berisi pesan akhlak dan syukur tanpa unsur maksiat. Menurut prinsip seni Islami, karya ini...',o:['Terlarang untuk semua seni','Tidak bernilai ibadah','Boleh dan bernilai baik karena isi serta tujuannya sesuai syariat','Wajib dihindari']}],u:['Rancang satu karya seni Islami sederhana di sekolahmu dan jelaskan nilai keindahan dan keharmonisan yang ingin disampaikan.']}},
{e:'📚',t:'Imam Mazhab dan Menghargai Perbedaan',tj:['Menceritakan biografi empat imam mazhab','Menjelaskan ciri khas pemikiran tiap imam','Menghargai perbedaan pendapat'],pk:['Imam Hanafi','Imam Maliki','Imam Syafi’i','Imam Hanbali','Menghargai perbedaan'],
ms:['Imam Abu Hanifah (80–150 H, Kufah): dikenal ahli ra’yu dan qiyas; mazhabnya disebut Hanafi.','Imam Malik bin Anas (93–179 H, Madinah): menulis Al-Muwaththa’ dan mempertimbangkan amal penduduk Madinah.','Imam Asy-Syafi’i (150–204 H): menulis Ar-Risalah dan Al-Umm serta menyusun ushul fikih; mazhabnya banyak dianut di Indonesia.','Imam Ahmad bin Hanbal (164–241 H, Baghdad): ahli hadis penyusun Musnad, teguh berpegang pada dalil.','Perbedaan pendapat lahir dari cara memahami dalil, bukan permusuhan. Sikapnya: saling menghormati, tidak menyalahkan, dan menjaga persaudaraan.'],
dl:[{r:'إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ',i:'Sesungguhnya orang-orang mukmin itu bersaudara, maka damaikanlah kedua saudaramu. (Q.S. Al-Hujurat: 10)'}],
ct:'Tidak menyalahkan teman yang tata cara ibadahnya berbeda selama bersandar pada dalil.',rg:'Para imam mazhab berjasa besar. Perbedaan pendapat disikapi dengan saling menghargai.',
Q:{m:[{q:'Imam yang menulis kitab Al-Muwaththa’ dan menjadi ulama Madinah adalah...',o:['Imam Hanafi','Imam Syafi’i','Imam Malik','Imam Hanbali']},{q:'Dua temanmu berbeda tata cara ibadah karena mengikuti mazhab berbeda, lalu saling menyalahkan. Sikap terbaik adalah...',o:['Memihak yang jumlahnya lebih banyak','Menghargai perbedaan yang bersandar pada dalil dan menjaga ukhuwah','Menyuruh keduanya berhenti belajar','Menganggap salah satu pasti sesat']}],u:['Jelaskan mengapa perbedaan pendapat para imam mazhab tidak boleh memecah persaudaraan, lalu beri contoh sikap yang kamu lakukan.']}},
{e:'🏰',t:'Dinasti Safawi dan Dinasti Mughal',tj:['Menjelaskan sejarah Dinasti Safawi di Persia','Menjelaskan sejarah Dinasti Mughal di India','Meneladani kemajuan peradaban Islam'],pk:['Safawi di Persia','Mughal di India','Kemajuan peradaban','Pelajaran sejarah'],
ms:['Dinasti Safawi berdiri di Persia pada 1501 M oleh Ismail I. Puncaknya pada masa Abbas I (1588–1629 M) dengan ibu kota Isfahan. Dinasti ini melemah dan berakhir pada abad ke-18.','Kemajuan Safawi: arsitektur (Masjid Imam di Isfahan), seni karpet dan keramik, perdagangan, dan ilmu pengetahuan.','Dinasti Mughal berdiri di India pada 1526 M oleh Babur setelah Pertempuran Panipat. Puncaknya pada masa Akbar (1556–1605 M) yang menerapkan toleransi beragama.','Kemajuan Mughal: arsitektur (Taj Mahal oleh Syah Jahan), sastra, seni lukis, dan tata pemerintahan. Dinasti ini berakhir pada 1857 M.'],
dl:[{r:'قَدْ خَلَتْ مِن قَبْلِكُمْ سُنَنٌ فَسِيرُوا فِي الْأَرْضِ فَانظُرُوا كَيْفَ كَانَ عَاقِبَةُ الْمُكَذِّبِينَ',i:'Sungguh telah berlalu sebelum kamu sunnah-sunnah Allah, maka berjalanlah di bumi dan perhatikan bagaimana kesudahan orang-orang yang mendustakan. (Q.S. Ali Imran: 137)'}],
ct:'Mempelajari sejarah untuk meneladani semangat ilmu, seni, dan toleransi.',rg:'Safawi dan Mughal menunjukkan kemajuan seni, arsitektur, dan tata negara yang bisa diteladani.',
Q:{m:[{q:'Taj Mahal dibangun pada masa Dinasti...',o:['Safawi','Mughal','Usmani','Abbasiyah']},{q:'Kebijakan Akbar yang menghormati berbagai agama di India menunjukkan...',o:['Pemaksaan keyakinan','Penutupan perdagangan','Penolakan ilmu pengetahuan','Toleransi yang mendukung stabilitas dan kemajuan']}],u:['Bandingkan satu kemajuan Dinasti Safawi dan Mughal, lalu tulis pelajaran yang bisa diteladani generasi muda.']}}
];
